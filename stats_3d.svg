<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="100%" height="210" style="background:#09090b; border-radius:12px; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="emeraldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="210" rx="12" fill="#09090b" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Left: Profile Summary -->
  <g transform="translate(36, 30)">
    <rect width="450" height="150" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    
    <text x="24" y="36" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">ENGINEERING PROFILE METRICS</text>

    <!-- Stat 1 -->
    <g transform="translate(24, 60)">
      <circle cx="12" cy="14" r="5" fill="#38bdf8"/>
      <text x="28" y="18" fill="#e2e8f0" font-size="13">Primary Architecture Focus</text>
      <text x="390" y="18" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="end">Multi-Agent Systems</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(24, 90)">
      <circle cx="12" cy="14" r="5" fill="#34d399"/>
      <text x="28" y="18" fill="#e2e8f0" font-size="13">Calculation Accuracy Guardrail</text>
      <text x="390" y="18" fill="#34d399" font-size="13" font-weight="700" text-anchor="end">100.0% Audited</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(24, 120)">
      <circle cx="12" cy="14" r="5" fill="#a855f7"/>
      <text x="28" y="18" fill="#e2e8f0" font-size="13">Automated Pytest Coverage</text>
      <text x="390" y="18" fill="#a855f7" font-size="13" font-weight="700" text-anchor="end">10/10 Passing</text>
    </g>
  </g>

  <!-- Right: Tech Distribution Bar & KPIs -->
  <g transform="translate(514, 30)">
    <rect width="450" height="150" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    
    <text x="24" y="36" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">CODEBASE TECHNOLOGY MIX</text>

    <!-- Distribution Bar -->
    <g transform="translate(24, 55)">
      <rect x="0" y="0" width="240" height="14" rx="4" fill="#3b82f6"/>
      <rect x="244" y="0" width="80" height="14" rx="4" fill="#10b981"/>
      <rect x="328" y="0" width="50" height="14" rx="4" fill="#8b5cf6"/>
      <rect x="382" y="0" width="20" height="14" rx="4" fill="#f59e0b"/>
    </g>

    <!-- Legend -->
    <g transform="translate(24, 95)">
      <circle cx="6" cy="6" r="4" fill="#3b82f6"/>
      <text x="16" y="10" fill="#cbd5e1" font-size="11">Python (65%)</text>

      <circle cx="120" cy="6" r="4" fill="#10b981"/>
      <text x="130" y="10" fill="#cbd5e1" font-size="11">FastAPI / APIs (20%)</text>

      <circle cx="270" cy="6" r="4" fill="#8b5cf6"/>
      <text x="280" y="10" fill="#cbd5e1" font-size="11">SQL &amp; Memory (10%)</text>

      <circle cx="6" cy="30" r="4" fill="#f59e0b"/>
      <text x="16" y="34" fill="#cbd5e1" font-size="11">C++ / Algorithms (5%)</text>
    </g>
  </g>
</svg>
