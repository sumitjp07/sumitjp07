<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200" style="background:#09090b; border-radius:12px; font-family:'Inter', -apple-system, sans-serif;">
  <rect width="1000" height="200" rx="12" fill="#09090b" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Left: Developer Profile Details -->
  <g transform="translate(36, 26)">
    <rect width="450" height="148" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="24" y="32" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">DEVELOPER PROFILE SNAPSHOT</text>

    <g transform="translate(24, 55)">
      <circle cx="10" cy="12" r="4.5" fill="#38bdf8"/>
      <text x="26" y="16" fill="#e2e8f0" font-size="12">Degree &amp; College</text>
      <text x="395" y="16" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="end">B.Tech CSE @ PCU Pune</text>
    </g>

    <g transform="translate(24, 85)">
      <circle cx="10" cy="12" r="4.5" fill="#34d399"/>
      <text x="26" y="16" fill="#e2e8f0" font-size="12">Graduation Year</text>
      <text x="395" y="16" fill="#34d399" font-size="12" font-weight="700" text-anchor="end">Class of 2029</text>
    </g>

    <g transform="translate(24, 115)">
      <circle cx="10" cy="12" r="4.5" fill="#a855f7"/>
      <text x="26" y="16" fill="#e2e8f0" font-size="12">Career Focus</text>
      <text x="395" y="16" fill="#a855f7" font-size="12" font-weight="700" text-anchor="end">Software &amp; AI Engineering</text>
    </g>
  </g>

  <!-- Right: Coding & Knowledge Spectrum -->
  <g transform="translate(514, 26)">
    <rect width="450" height="148" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="24" y="32" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">DEVELOPMENT INTERESTS &amp; STACK</text>

    <!-- Spectrum Bar -->
    <g transform="translate(24, 55)">
      <rect x="0" y="0" width="160" height="14" rx="4" fill="#3b82f6"/>
      <rect x="164" y="0" width="120" height="14" rx="4" fill="#10b981"/>
      <rect x="288" y="0" width="80" height="14" rx="4" fill="#8b5cf6"/>
      <rect x="372" y="0" width="30" height="14" rx="4" fill="#f59e0b"/>
    </g>

    <!-- Legend -->
    <g transform="translate(24, 95)">
      <circle cx="6" cy="6" r="4" fill="#3b82f6"/>
      <text x="16" y="10" fill="#cbd5e1" font-size="11">Core Languages (C++, Python, Java)</text>

      <circle cx="230" cy="6" r="4" fill="#10b981"/>
      <text x="240" y="10" fill="#cbd5e1" font-size="11">Data Structures &amp; Logic</text>

      <circle cx="6" cy="30" r="4" fill="#8b5cf6"/>
      <text x="16" y="34" fill="#cbd5e1" font-size="11">AI &amp; Multi-Agent Systems</text>

      <circle cx="230" cy="30" r="4" fill="#f59e0b"/>
      <text x="240" y="34" fill="#cbd5e1" font-size="11">Web, SQL &amp; Tools</text>
    </g>
