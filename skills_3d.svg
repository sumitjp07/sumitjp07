    <!-- Git & GitHub -->
    <g transform="translate(190, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#f43f5e" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#881337"/>
      <text x="21" y="41" fill="#fb7185" font-size="16" font-weight="bold">🐙</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Git &amp; GitHub</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Version Control</text>
    </g>

    <!-- Linux -->
    <g transform="translate(380, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#a855f7" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#581c87"/>
      <text x="21" y="41" fill="#c084fc" font-size="16" font-weight="bold">🐧</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Linux / OS</text>
      <text x="52" y="48" fill="#64748b" font-size="10">CLI &amp; Environment</text>
    </g>

    <!-- AI & Multi-Agent -->
    <g transform="translate(570, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#8b5cf6" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#4c1d95"/>
      <text x="21" y="41" fill="#a78bfa" font-size="16" font-weight="bold">🤖</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">AI &amp; LLMs</text>
      <text x="52" y="48" fill="#64748b" font-size="10">LangGraph &amp; Agents</text>
    </g>

    <!-- Problem Solving -->
    <g transform="translate(760, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#64748b" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#1e293b"/>
      <text x="21" y="41" fill="#94a3b8" font-size="16" font-weight="bold">🎯</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Problem Solving</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Logic &amp; Optimization</text>
