<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="220" style="background:#08080a; border-radius:12px; font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <rect width="1000" height="220" rx="12" fill="#08080a" stroke="#27272a" stroke-width="1"/>

  <!-- 4 Strategic Competency Columns -->
  <g transform="translate(30, 24)">
    
    <!-- Column 1: Core Programming -->
    <g transform="translate(0, 0)">
      <rect width="220" height="172" rx="8" fill="#111115" stroke="#222228" stroke-width="1"/>
      <g transform="translate(20, 24)">
        <text fill="#3b82f6" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1">01 / CORE LANGUAGES</text>
        <text y="28" fill="#ffffff" font-size="15" font-weight="700">Python 3.11+</text>
        <text y="44" fill="#71717a" font-size="11">Production &amp; AI backend</text>

        <text y="74" fill="#ffffff" font-size="15" font-weight="700">C / C++</text>
        <text y="90" fill="#71717a" font-size="11">Data structures &amp; memory</text>

        <text y="120" fill="#ffffff" font-size="15" font-weight="700">SQL</text>
        <text y="136" fill="#71717a" font-size="11">Relational query design</text>
      </g>
    </g>

    <!-- Column 2: AI & Multi-Agent -->
    <g transform="translate(240, 0)">
      <rect width="220" height="172" rx="8" fill="#111115" stroke="#222228" stroke-width="1"/>
      <g transform="translate(20, 24)">
        <text fill="#3b82f6" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1">02 / AGENTS &amp; AI</text>
        <text y="28" fill="#ffffff" font-size="15" font-weight="700">LangGraph</text>
        <text y="44" fill="#71717a" font-size="11">Cyclic state machines</text>

        <text y="74" fill="#ffffff" font-size="15" font-weight="700">Google Gemini API</text>
        <text y="90" fill="#71717a" font-size="11">Interactions &amp; reasoning</text>

        <text y="120" fill="#ffffff" font-size="15" font-weight="700">Evaluation Guardrails</text>
        <text y="136" fill="#71717a" font-size="11">Ground-truth verification</text>
      </g>
    </g>

    <!-- Column 3: Backend & Data -->
    <g transform="translate(480, 0)">
      <rect width="220" height="172" rx="8" fill="#111115" stroke="#222228" stroke-width="1"/>
      <g transform="translate(20, 24)">
        <text fill="#3b82f6" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1">03 / BACKEND &amp; DATA</text>
        <text y="28" fill="#ffffff" font-size="15" font-weight="700">FastAPI &amp; REST</text>
        <text y="44" fill="#71717a" font-size="11">Asynchronous APIs</text>

        <text y="74" fill="#ffffff" font-size="15" font-weight="700">Pandas &amp; NumPy</text>
        <text y="90" fill="#71717a" font-size="11">Statistical data engines</text>

        <text y="120" fill="#ffffff" font-size="15" font-weight="700">SQLite &amp; Persistence</text>
        <text y="136" fill="#71717a" font-size="11">Session trace logging</text>
      </g>
    </g>

    <!-- Column 4: Engineering & Tools -->
    <g transform="translate(720, 0)">
      <rect width="220" height="172" rx="8" fill="#111115" stroke="#222228" stroke-width="1"/>
      <g transform="translate(20, 24)">
        <text fill="#3b82f6" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1">04 / TOOLING &amp; QA</text>
        <text y="28" fill="#ffffff" font-size="15" font-weight="700">Pytest Suite</text>
        <text y="44" fill="#71717a" font-size="11">Automated unit &amp; e2e testing</text>

        <text y="74" fill="#ffffff" font-size="15" font-weight="700">Git &amp; GitHub Actions</text>
        <text y="90" fill="#71717a" font-size="11">Continuous integration</text>

        <text y="120" fill="#ffffff" font-size="15" font-weight="700">Linux &amp; Environment</text>
        <text y="136" fill="#71717a" font-size="11">CLI &amp; isolated venvs</text>
      </g>
    </g>

  </g>
</svg>
