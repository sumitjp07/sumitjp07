    <g transform="translate(0, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#06b6d4" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#155e75"/>
      <text x="21" y="41" fill="#22d3ee" font-size="16" font-weight="bold">🗄️</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">SQL &amp; DBMS</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Relational Databases</text>
