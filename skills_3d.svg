<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240" style="background:#09090b; border-radius:12px; font-family:'Inter', -apple-system, sans-serif;">
  <rect width="1000" height="240" rx="12" fill="#09090b" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Row 1: Core Programming Languages -->
  <g transform="translate(30, 30)">
    <!-- C++ -->
    <g transform="translate(0, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#1e3a8a"/>
      <text x="21" y="41" fill="#60a5fa" font-size="14" font-weight="bold">C++</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">C / C++</text>
      <text x="52" y="48" fill="#64748b" font-size="10">DSA &amp; Problem Solving</text>
    </g>

    <!-- Python -->
    <g transform="translate(190, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#eab308" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#713f12"/>
      <text x="21" y="41" fill="#facc15" font-size="16" font-weight="bold">🐍</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Python</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Scripting &amp; AI Logic</text>
    </g>

    <!-- Java -->
    <g transform="translate(380, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#7f1d1d"/>
      <text x="21" y="41" fill="#f87171" font-size="16" font-weight="bold">☕</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Java</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Object-Oriented Dev</text>
    </g>

    <!-- Data Structures -->
    <g transform="translate(570, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#064e3b"/>
      <text x="21" y="41" fill="#34d399" font-size="16" font-weight="bold">🌳</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Data Structures</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Core Algorithms</text>
    </g>

    <!-- Web Dev -->
    <g transform="translate(760, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#f97316" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#7c2d12"/>
      <text x="21" y="41" fill="#fb923c" font-size="16" font-weight="bold">🌐</text>
