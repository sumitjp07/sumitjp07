<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200" style="background:#0b0f19; border-radius:12px; font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <rect width="1000" height="200" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

  <!-- 4 Clean Technical Pillars -->
  <g transform="translate(24, 20)">
    
    <!-- Box 1 -->
    <g transform="translate(0, 0)">
      <rect width="224" height="158" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <g transform="translate(18, 24)">
        <text fill="#38bdf8" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="1">01 / PROGRAMMING</text>
        <text y="26" fill="#ffffff" font-size="15" font-weight="700">Python 3.11+</text>
        <text y="42" fill="#94a3b8" font-size="11">Production &amp; AI backend</text>

        <text y="70" fill="#ffffff" font-size="15" font-weight="700">C / C++</text>
        <text y="86" fill="#94a3b8" font-size="11">Data structures &amp; memory</text>

        <text y="114" fill="#ffffff" font-size="15" font-weight="700">SQL</text>
        <text y="130" fill="#94a3b8" font-size="11">Relational query design</text>
      </g>
    </g>

    <!-- Box 2 -->
    <g transform="translate(242, 0)">
      <rect width="224" height="158" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <g transform="translate(18, 24)">
        <text fill="#818cf8" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="1">02 / AI &amp; AGENTS</text>
        <text y="26" fill="#ffffff" font-size="15" font-weight="700">LangGraph</text>
        <text y="42" fill="#94a3b8" font-size="11">Cyclic state machines</text>

        <text y="70" fill="#ffffff" font-size="15" font-weight="700">Google Gemini API</text>
        <text y="86" fill="#94a3b8" font-size="11">Interactions &amp; reasoning</text>

        <text y="114" fill="#ffffff" font-size="15" font-weight="700">Audit Guardrails</text>
        <text y="130" fill="#94a3b8" font-size="11">Zero-hallucination critic</text>
      </g>
    </g>

    <!-- Box 3 -->
    <g transform="translate(484, 0)">
      <rect width="224" height="158" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <g transform="translate(18, 24)">
        <text fill="#34d399" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="1">03 / BACKEND &amp; DATA</text>
        <text y="26" fill="#ffffff" font-size="15" font-weight="700">FastAPI &amp; REST</text>
        <text y="42" fill="#94a3b8" font-size="11">Asynchronous APIs</text>

        <text y="70" fill="#ffffff" font-size="15" font-weight="700">Pandas &amp; NumPy</text>
        <text y="86" fill="#94a3b8" font-size="11">Statistical data engines</text>

        <text y="114" fill="#ffffff" font-size="15" font-weight="700">SQLite &amp; Persistence</text>
        <text y="130" fill="#94a3b8" font-size="11">Session trace storage</text>
      </g>
    </g>

    <!-- Box 4 -->
    <g transform="translate(726, 0)">
      <rect width="224" height="158" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <g transform="translate(18, 24)">
        <text fill="#f472b6" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="1">04 / TOOLING &amp; QA</text>
        <text y="26" fill="#ffffff" font-size="15" font-weight="700">Pytest Suite</text>
        <text y="42" fill="#94a3b8" font-size="11">100% automated test coverage</text>

        <text y="70" fill="#ffffff" font-size="15" font-weight="700">Git &amp; GitHub Actions</text>
        <text y="86" fill="#94a3b8" font-size="11">CI/CD pipelines</text>

        <text y="114" fill="#ffffff" font-size="15" font-weight="700">Linux &amp; Environment</text>
        <text y="130" fill="#94a3b8" font-size="11">CLI &amp; virtual environments</text>
