<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240" style="background:#09090b; border-radius:12px; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="neonBlur">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="240" rx="12" fill="#09090b" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Row 1: AI, LLM & Agent Stack -->
  <g transform="translate(30, 30)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#1e3a8a"/>
      <text x="21" y="41" fill="#60a5fa" font-size="16" font-weight="bold">🐍</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Python 3.11+</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Core Engineering</text>
    </g>

    <!-- LangGraph -->
    <g transform="translate(190, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#8b5cf6" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#4c1d95"/>
      <text x="21" y="41" fill="#c084fc" font-size="16" font-weight="bold">🕸️</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">LangGraph 0.2</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Cyclic StateGraphs</text>
    </g>

    <!-- Google Gemini -->
    <g transform="translate(380, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#0369a1"/>
      <text x="21" y="41" fill="#38bdf8" font-size="16" font-weight="bold">✨</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Google Gemini</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Interactions API</text>
    </g>

    <!-- FastAPI -->
    <g transform="translate(570, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#064e3b"/>
      <text x="21" y="41" fill="#34d399" font-size="16" font-weight="bold">⚡</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">FastAPI REST</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Async Microservices</text>
    </g>

    <!-- Pandas -->
    <g transform="translate(760, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#831843"/>
      <text x="21" y="41" fill="#f472b6" font-size="16" font-weight="bold">🐼</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Pandas &amp; NumPy</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Deterministic Stats</text>
    </g>
  </g>

  <!-- Row 2: Systems, Testing & Storage -->
  <g transform="translate(30, 125)">
    <!-- SQLite -->
    <g transform="translate(0, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#06b6d4" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#155e75"/>
      <text x="21" y="41" fill="#22d3ee" font-size="16" font-weight="bold">🗄️</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">SQLite Memory</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Session Traces</text>
    </g>

    <!-- Pytest -->
    <g transform="translate(190, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#78350f"/>
      <text x="21" y="41" fill="#fbbf24" font-size="16" font-weight="bold">🧪</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Pytest Suite</text>
      <text x="52" y="48" fill="#64748b" font-size="10">100% Pass Rate</text>
    </g>

    <!-- ReportLab PDF -->
    <g transform="translate(380, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#7f1d1d"/>
      <text x="21" y="41" fill="#f87171" font-size="16" font-weight="bold">📄</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">ReportLab PDF</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Executive Briefs</text>
    </g>

    <!-- Git & CI/CD -->
    <g transform="translate(570, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#312e81"/>
      <text x="21" y="41" fill="#818cf8" font-size="16" font-weight="bold">⚙️</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">GitHub Actions</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Automated CI/CD</text>
    </g>

    <!-- Linux / C++ -->
    <g transform="translate(760, 0)">
      <rect width="170" height="70" rx="10" fill="#111827" stroke="#64748b" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#1e293b"/>
      <text x="21" y="41" fill="#94a3b8" font-size="16" font-weight="bold">🐧</text>
      <text x="52" y="32" fill="#f8fafc" font-size="13" font-weight="700">Linux &amp; C++</text>
      <text x="52" y="48" fill="#64748b" font-size="10">Low-Level Foundations</text>
    </g>
  </g>
</svg>
