<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" style="background:#08080a; border-radius:12px; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Titanium Metallic Typography Gradient -->
    <linearGradient id="titaniumText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Deep Ambient Spotlight -->
    <radialGradient id="subtleSpotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#08080a" stop-opacity="0"/>
    </radialGradient>

    <!-- Hairline Grid Pattern -->
    <pattern id="fineGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Canvas & Background Architecture -->
  <rect width="1200" height="320" rx="12" fill="#08080a"/>
  <rect width="1200" height="320" rx="12" fill="url(#fineGrid)"/>
  <rect width="1200" height="320" rx="12" fill="url(#subtleSpotlight)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="11.5" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Top Status Monospace Rule -->
  <g transform="translate(60, 48)">
    <circle cx="0" cy="0" r="3.5" fill="#3b82f6"/>
    <text x="14" y="3.5" fill="#71717a" font-size="11" font-family="'JetBrains Mono', 'Fira Code', monospace" letter-spacing="1.5">SUMIT JITENDRA PATIL // PORTFOLIO SPECIFICATION v2.6</text>
    <text x="1080" y="3.5" fill="#52525b" font-size="11" font-family="'JetBrains Mono', 'Fira Code', monospace" text-anchor="end">PCU PUNE • B.TECH CSE '29</text>
  </g>

  <!-- Center Master Monolithic Typography -->
  <g transform="translate(60, 142)">
    <text fill="url(#titaniumText)" font-size="52" font-weight="800" letter-spacing="-1.5">Sumit Jitendra Patil</text>
  </g>

  <!-- Editorial Subtitle with em-dash -->
  <g transform="translate(60, 185)">
    <text fill="#a1a1aa" font-size="16" font-weight="400" letter-spacing="-0.2">
      Computer Science Undergraduate &amp; Systems Builder — Designing deterministic AI agents and scalable software.
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="220" x2="1140" y2="220" stroke="#1f242d" stroke-width="1"/>

  <!-- Three Minimalist Architectural Pillars -->
  <g transform="translate(60, 252)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <text fill="#3b82f6" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1">01 / ARCHITECTURE</text>
      <text y="24" fill="#e2e8f0" font-size="13" font-weight="500">Autonomous Multi-Agent Systems</text>
      <text y="42" fill="#71717a" font-size="11">StateGraph cycles &amp; deterministic tool layers</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(380, 0)">
      <text fill="#3b82f6" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1">02 / FOUNDATIONS</text>
      <text y="24" fill="#e2e8f0" font-size="13" font-weight="500">Algorithms &amp; Core Computing</text>
      <text y="42" fill="#71717a" font-size="11">Data Structures, C++, Python, OOP &amp; DBMS</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(760, 0)">
      <text fill="#3b82f6" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1">03 / VERIFICATION</text>
      <text y="24" fill="#e2e8f0" font-size="13" font-weight="500">Deterministic Evaluation</text>
      <text y="42" fill="#71717a" font-size="11">Mathematical audit guardrails &amp; zero hallucination</text>
    </g>
  </g>
</svg>
