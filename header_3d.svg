<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220">
  <defs>
    <!-- Crisp High-Contrast Titanium Metallic Gradient -->
    <linearGradient id="titaniumSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Subtle Cyan Accent Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Solid Clean Background -->
  <rect width="1200" height="220" rx="16" fill="#090D16"/>
  <rect width="1200" height="220" rx="16" fill="url(#centerGlow)"/>
  <rect x="1" y="1" width="1198" height="218" rx="15" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Monospace Tagline (Large & Legible: 18px) -->
  <g transform="translate(60, 48)">
    <circle cx="8" cy="8" r="6" fill="#38BDF8"/>
    <text x="24" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">PORTFOLIO // B.TECH CSE (2026–2029) • PCU PUNE</text>
  </g>

  <!-- Master Name Headline (Large: 58px) -->
  <g transform="translate(60, 126)">
    <text fill="url(#titaniumSheen)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-1">SUMIT JITENDRA PATIL</text>
  </g>

  <!-- Subtitle (Clear: 20px) -->
  <g transform="translate(60, 172)">
    <text fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Software Developer &amp; Autonomous AI Systems Builder</text>
    <text x="560" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">— Engineering reliable agent workflows &amp; scalable backend software.</text>
  </g>
</svg>
