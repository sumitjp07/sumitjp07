<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" style="background:#09090b; border-radius:16px; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- 3D Cyber Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- 3D Glow Filter -->
    <filter id="glow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cyber Dark Canvas -->
  <rect width="1200" height="380" rx="16" fill="#09090b" stroke="#1f2937" stroke-width="2"/>

  <!-- 3D Isometric Ground Grid -->
  <g opacity="0.3">
    <path d="M 0 320 L 600 180 L 1200 320 M 0 360 L 600 220 L 1200 360 M 100 380 L 600 260 L 1100 380" stroke="#38bdf8" stroke-width="1" fill="none"/>
    <path d="M 200 380 L 600 180 L 1000 380 M 350 380 L 600 180 L 850 380 M 500 380 L 600 180 L 700 380" stroke="#818cf8" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Ambient Light Glow -->
  <circle cx="600" cy="160" r="260" fill="#7000ff" opacity="0.12" filter="url(#glow3d)"/>
  <circle cx="600" cy="120" r="130" fill="#00f0ff" opacity="0.1" filter="url(#glow3d)"/>

  <!-- 3D Isometric Floating Cube Left -->
  <g transform="translate(130, 130)" opacity="0.85">
    <polygon points="40,0 80,20 40,40 0,20" fill="url(#cubeTop)"/>
    <polygon points="0,20 40,40 40,85 0,65" fill="url(#cubeLeft)"/>
    <polygon points="40,40 80,20 80,65 40,85" fill="url(#cubeRight)"/>
    <text x="24" y="58" fill="#38bdf8" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- 3D Isometric Floating Cube Right -->
  <g transform="translate(990, 110)" opacity="0.85">
    <polygon points="45,0 90,22 45,45 0,22" fill="url(#cubeTop)"/>
    <polygon points="0,22 45,45 45,95 0,72" fill="url(#cubeLeft)"/>
    <polygon points="45,45 90,22 90,72 45,95" fill="url(#cubeRight)"/>
    <text x="26" y="66" fill="#a78bfa" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="bold">CSE</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow3d)"/>
    <circle cx="-155" cy="0" r="4.5" fill="#00F0FF"/>
    <text x="8" y="5" fill="#f1f5f9" font-size="11" font-weight="700" letter-spacing="2">DEVELOPER • EXPLORER • BUILDER</text>
  </g>

  <!-- 3D Extruded Master Name Title -->
  <g transform="translate(600, 145)" text-anchor="middle">
    <text x="0" y="8" fill="#030712" font-size="64" font-weight="900" letter-spacing="4">SUMIT PATIL</text>
    <text x="0" y="6" fill="#0f172a" font-size="64" font-weight="900" letter-spacing="4">SUMIT PATIL</text>
    <text x="0" y="4" fill="#1e1b4b" font-size="64" font-weight="900" letter-spacing="4">SUMIT PATIL</text>
    <text x="0" y="2" fill="#4338ca" font-size="64" font-weight="900" letter-spacing="4">SUMIT PATIL</text>
    <text x="0" y="0" fill="url(#cyberGrad)" font-size="64" font-weight="900" letter-spacing="4" filter="url(#glow3d)">SUMIT PATIL</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 192)" text-anchor="middle">
    <text fill="#94a3b8" font-size="16" font-weight="500" letter-spacing="0.5">
      B.Tech in Computer Science &amp; Engineering • Pimpri Chinchwad University (PCU), Pune
    </text>
  </g>

  <!-- 4 Personal Developer Pillars -->
  <g transform="translate(180, 240)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect width="190" height="46" rx="10" fill="#131722" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <circle cx="28" cy="23" r="5" fill="#38bdf8"/>
      <text x="44" y="27" fill="#e2e8f0" font-size="12" font-weight="700">Problem Solving</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(215, 0)">
      <rect width="190" height="46" rx="10" fill="#131722" stroke="#818cf8" stroke-width="1.2" opacity="0.95"/>
      <circle cx="28" cy="23" r="5" fill="#818cf8"/>
      <text x="44" y="27" fill="#e2e8f0" font-size="12" font-weight="700">Software Dev</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(430, 0)">
      <rect width="190" height="46" rx="10" fill="#131722" stroke="#34d399" stroke-width="1.2" opacity="0.95"/>
      <circle cx="28" cy="23" r="5" fill="#34d399"/>
      <text x="44" y="27" fill="#e2e8f0" font-size="12" font-weight="700">AI &amp; Data Science</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(645, 0)">
      <rect width="195" height="46" rx="10" fill="#131722" stroke="#f472b6" stroke-width="1.2" opacity="0.95"/>
      <circle cx="28" cy="23" r="5" fill="#f472b6"/>
      <text x="44" y="27" fill="#e2e8f0" font-size="12" font-weight="700">Open Source</text>
    </g>
  </g>

  <!-- Bottom Terminal Tag -->
  <g transform="translate(600, 335)" text-anchor="middle">
    <rect x="-210" y="-12" width="420" height="24" rx="12" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
    <text x="0" y="4" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace">
      ⚡ CONSTANTLY LEARNING &amp; BUILDING COOL STUFF
    </text>
  </g>
</svg>
