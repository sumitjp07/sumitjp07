<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background:#0b0f19; border-radius:16px; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Modern Metallic Titanium Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Electric Indigo Accent Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#334155" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="340" rx="16" fill="#0b0f19"/>
  <rect width="1200" height="340" rx="16" fill="url(#dotGrid)"/>
  <rect width="1200" height="340" rx="16" fill="url(#cardGlow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(64, 44)">
    <rect width="12" height="12" rx="3" fill="#38bdf8"/>
    <text x="22" y="10" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1.5">SUMIT JITENDRA PATIL // PORTFOLIO</text>
    <text x="1072" y="10" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="end">PCU PUNE • B.TECH CSE (2026–2029)</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(64, 135)">
    <text fill="url(#titleGrad)" font-size="54" font-weight="900" letter-spacing="-1.5">Sumit Jitendra Patil</text>
  </g>

  <!-- Subtitle with Color Accent -->
  <g transform="translate(64, 178)">
    <text fill="#38bdf8" font-size="16" font-weight="600">Software Developer &amp; Autonomous AI Systems Builder</text>
    <text x="440" fill="#94a3b8" font-size="16" font-weight="400">— Engineering reliable agent workflows &amp; scalable backend systems.</text>
  </g>

  <!-- Divider Line -->
  <line x1="64" y1="214" x2="1136" y2="214" stroke="#1e293b" stroke-width="1"/>

  <!-- 3 High-Signal Focus Cards -->
  <g transform="translate(64, 242)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <rect width="330" height="64" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <g transform="translate(18, 22)">
        <text fill="#38bdf8" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="1">01 / ARCHITECTURE</text>
        <text y="24" fill="#f1f5f9" font-size="13" font-weight="600">Autonomous Multi-Agent AI</text>
        <text y="40" fill="#94a3b8" font-size="11">LangGraph cyclic state machines &amp; tool layers</text>
      </g>
    </g>

    <!-- Column 2 -->
    <g transform="translate(370, 0)">
      <rect width="330" height="64" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <g transform="translate(18, 22)">
        <text fill="#818cf8" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="1">02 / CORE SYSTEMS</text>
        <text y="24" fill="#f1f5f9" font-size="13" font-weight="600">Backend &amp; Algorithm Design</text>
        <text y="40" fill="#94a3b8" font-size="11">Python, FastAPI, C++, Data Structures &amp; SQL</text>
      </g>
    </g>

    <!-- Column 3 -->
    <g transform="translate(740, 0)">
      <rect width="330" height="64" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
      <g transform="translate(18, 22)">
        <text fill="#34d399" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="1">03 / VERIFICATION</text>
        <text y="24" fill="#f1f5f9" font-size="13" font-weight="600">Mathematical Accuracy Guardrails</text>
        <text y="40" fill="#94a3b8" font-size="11">Audited arithmetic &amp; zero-hallucination pipelines</text>
      </g>
    </g>
  </g>
</svg>
