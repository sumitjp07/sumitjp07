<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background:#09090b; border-radius:16px; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- 3D Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- 3D Shadow Filters -->
    <filter id="glow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow3d">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00F0FF" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Deep Cyber Dark Canvas -->
  <rect width="1200" height="420" rx="16" fill="#09090b" stroke="#1f2937" stroke-width="2"/>

  <!-- 3D Isometric Ground Grid -->
  <g opacity="0.35">
    <!-- Isometric Lines -->
    <path d="M 0 350 L 600 200 L 1200 350 M 0 390 L 600 240 L 1200 390 M 100 420 L 600 290 L 1100 420" stroke="#38bdf8" stroke-width="1" fill="none"/>
    <path d="M 200 420 L 600 200 L 1000 420 M 350 420 L 600 200 L 850 420 M 500 420 L 600 200 L 700 420" stroke="#818cf8" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Ambient Light Sphere -->
  <circle cx="600" cy="180" r="280" fill="#7000ff" opacity="0.12" filter="url(#glow3d)"/>
  <circle cx="600" cy="140" r="140" fill="#00f0ff" opacity="0.1" filter="url(#glow3d)"/>

  <!-- 3D Isometric Floating Cube Left -->
  <g transform="translate(140, 160)" opacity="0.85">
    <!-- Top Face -->
    <polygon points="40,0 80,20 40,40 0,20" fill="url(#cubeTop)"/>
    <!-- Left Face -->
    <polygon points="0,20 40,40 40,85 0,65" fill="url(#cubeLeft)"/>
    <!-- Right Face -->
    <polygon points="40,40 80,20 80,65 40,85" fill="url(#cubeRight)"/>
    <text x="26" y="58" fill="#38bdf8" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="bold">AI</text>
  </g>

  <!-- 3D Isometric Floating Cube Right -->
  <g transform="translate(980, 140)" opacity="0.85">
    <!-- Top Face -->
    <polygon points="45,0 90,22 45,45 0,22" fill="url(#cubeTop)"/>
    <!-- Left Face -->
    <polygon points="0,22 45,45 45,95 0,72" fill="url(#cubeLeft)"/>
    <!-- Right Face -->
    <polygon points="45,45 90,22 90,72 45,95" fill="url(#cubeRight)"/>
    <text x="24" y="66" fill="#a78bfa" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="bold">AGY</text>
  </g>

  <!-- Top Futuristic Badge -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow3d)"/>
    <circle cx="-165" cy="0" r="4.5" fill="#00F0FF"/>
    <text x="8" y="5" fill="#f1f5f9" font-size="11" font-weight="700" letter-spacing="2">AUTONOMOUS MULTI-AGENT ARCHITECT</text>
  </g>

  <!-- 3D Extruded Master Name Title -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- 3D Shadow Layers for Extrusion Effect -->
    <text x="0" y="8" fill="#030712" font-size="64" font-weight="900" letter-spacing="4">SUMIT PATIL</text>
    <text x="0" y="6" fill="#0f172a" font-size="64" font-weight="900" letter-spacing="4">SUMIT PATIL</text>
    <text x="0" y="4" fill="#1e1b4b" font-size="64" font-weight="900" letter-spacing="4">SUMIT PATIL</text>
    <text x="0" y="2" fill="#4338ca" font-size="64" font-weight="900" letter-spacing="4">SUMIT PATIL</text>
    <!-- Foreground Glowing Text -->
    <text x="0" y="0" fill="url(#cyberGrad)" font-size="64" font-weight="900" letter-spacing="4" filter="url(#glow3d)">SUMIT PATIL</text>
  </g>

  <!-- Holographic Dynamic Subtitle -->
  <g transform="translate(600, 205)" text-anchor="middle">
    <text fill="#94a3b8" font-size="16" font-weight="500" letter-spacing="1">
      B.Tech Computer Science &amp; Engineering '29 • Pimpri Chinchwad University (PCU), Pune
    </text>
  </g>

  <!-- 3D Floating Tech Badges (Glassmorphic) -->
  <g transform="translate(180, 260)">
    <!-- Badge 1: LangGraph -->
    <g transform="translate(0, 0)">
      <rect width="190" height="48" rx="10" fill="#131722" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <circle cx="28" cy="24" r="6" fill="#38bdf8"/>
      <text x="44" y="22" fill="#e2e8f0" font-size="12" font-weight="700">LangGraph 0.2</text>
      <text x="44" y="36" fill="#94a3b8" font-size="10">Cyclic State Machine</text>
    </g>

    <!-- Badge 2: Google Gemini -->
    <g transform="translate(210, 0)">
      <rect width="200" height="48" rx="10" fill="#131722" stroke="#818cf8" stroke-width="1.2" opacity="0.95"/>
      <circle cx="28" cy="24" r="6" fill="#818cf8"/>
      <text x="44" y="22" fill="#e2e8f0" font-size="12" font-weight="700">Google Gemini API</text>
      <text x="44" y="36" fill="#94a3b8" font-size="10">Interactions &amp; Reasoning</text>
    </g>

    <!-- Badge 3: Ground Truth -->
    <g transform="translate(430, 0)">
      <rect width="200" height="48" rx="10" fill="#131722" stroke="#34d399" stroke-width="1.2" opacity="0.95"/>
      <circle cx="28" cy="24" r="6" fill="#34d399"/>
      <text x="44" y="22" fill="#e2e8f0" font-size="12" font-weight="700">100% Accuracy</text>
      <text x="44" y="36" fill="#94a3b8" font-size="10">Zero-Hallucination Critic</text>
    </g>

    <!-- Badge 4: FastAPI -->
    <g transform="translate(650, 0)">
      <rect width="190" height="48" rx="10" fill="#131722" stroke="#f472b6" stroke-width="1.2" opacity="0.95"/>
      <circle cx="28" cy="24" r="6" fill="#f472b6"/>
      <text x="44" y="22" fill="#e2e8f0" font-size="12" font-weight="700">FastAPI REST</text>
      <text x="44" y="36" fill="#94a3b8" font-size="10">Async Python Engine</text>
    </g>
  </g>

  <!-- 3D Cyber Footer Strip -->
  <g transform="translate(600, 375)" text-anchor="middle">
    <rect x="-240" y="-12" width="480" height="24" rx="12" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
    <text x="0" y="4" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace">
      🚀 OPEN TO AI AGENT ENGINEER &amp; APPLIED AI ROLES
    </text>
  </g>
</svg>
